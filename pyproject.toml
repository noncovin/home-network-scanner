[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-network-scanner"
version = "0.1.0"
description = "Open-source home network scanner built with Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "jinja2==3.1.6",
  "sqlalchemy==2.0.43",
  "pydantic==2.11.7",
  "python-nmap==0.7.1",
  "scapy==2.6.1",
  "requests==2.32.5",
  "python-dotenv==1.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
